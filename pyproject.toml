[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studytracker-viewer-v0"
version = "0.8.1"
description = "StudyTracker external ViewerPack with host-configured database path, timeline interaction, record editing, and audit history"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["viewer_v0*"]
