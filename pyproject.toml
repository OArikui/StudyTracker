[project]
name = "study-tracker"
version = "3.5.2"
description = "Personal study tracker designed to complement ManicTime"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
windows-media = [
    "winrt-runtime>=3.1.0",
    "winrt-Windows.Media.Control>=3.1.0",
]

[project.scripts]
study-tracker = "study_tracker.app:run"
